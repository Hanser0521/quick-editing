name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches manifest
        run: test "$GITHUB_REF_NAME" = "$(node -p "require('./manifest.json').version")"
      - name: Package plugin
        run: zip "quick-editing-$GITHUB_REF_NAME.zip" main.js manifest.json styles.css
      - name: Create GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          main.js manifest.json styles.css "quick-editing-$GITHUB_REF_NAME.zip"
          --verify-tag --generate-notes --title "Quick Editing $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
